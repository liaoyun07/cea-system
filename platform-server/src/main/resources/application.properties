spring.application.name=cloud-edge-backend
server.address=127.0.0.1
server.port=${BACKEND_PORT:18085}
spring.datasource.url=${BACKEND_DB_URL}
spring.datasource.username=${BACKEND_DB_USER}
spring.datasource.password=${BACKEND_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.locations=classpath:db/migration/runtime,classpath:db/migration/dataflow
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
server.error.include-message=never
platform.executor.enabled=true
platform.executor.poll-delay-ms=250
platform.worker.enabled=true
platform.worker.poll-delay-ms=100
platform.worker.lease-ms=3000
spring.task.scheduling.pool.size=2
platform.worker.concurrency=4
platform.scheduler.enabled=true
platform.scheduler.poll-delay-ms=250
platform.security.users[0].name=${BACKEND_USER:developer}
platform.security.users[0].password=${BACKEND_PASSWORD}
platform.security.users[0].namespaces=${BACKEND_NAMESPACES:lab}
platform.security.users[0].actions=READ,WRITE,EXECUTE
