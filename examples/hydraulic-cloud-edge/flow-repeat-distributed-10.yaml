        type: platform.Application
        timeout: PT5M
        container:
          applicationId: hydraulic-compare
          version: hc04-v1
          candidateClusters:
            - edge-a
          command:
            - python
            - /app/repeat.py
            - edge
            - --passes
            - "10"
          parameters:
            EDGE_GROUP:
              source: LITERAL
              value: edge-a
          inputFiles:
            raw-0.npz:
              source: LITERAL
              value: s3://cea-artifacts-edge-a/lab/hc03/raw/edge-a.npz
