  - id: fusion
    type: platform.Application
    timeout: PT5M
    container:
      applicationId: hydraulic-compare
      version: hc04-reference-v1
      candidateClusters:
        - cloud
      command:
        - sh
        - -ec
        - ln -s "$REFERENCE_PATH" /cea-work/in/reference.npz; exec python
          /app/repeat.py fuse --passes 10
      parameters:
        Z_THRESHOLD:
          source: LITERAL
          value: 3
        REFERENCE:
