schemaVersion: 1
namespace: lab
id: hydraulic-central-repeat10
description: HC-04 10 complete dataset passes, 2205 unique cycles, same one/four Jobs.
tasks:
  - id: central
    type: platform.Application
    timeout: PT5M
    container:
      applicationId: hydraulic-compare
      version: hc04-reference-v1
      candidateClusters:
        - cloud
      command:
        - sh
        - -ec
        - ln -s "$REFERENCE_PATH" /cea-work/in/reference.npz; exec python
          /app/repeat.py central --passes 10
      parameters:
        Z_THRESHOLD:
          source: LITERAL
          value: 3
        REFERENCE:
          source: LITERAL
          value: hydraulic-reference/hc01-v1
      inputFiles:
