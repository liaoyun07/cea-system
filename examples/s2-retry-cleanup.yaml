schemaVersion: 1
namespace: lab
id: retry-cleanup
description: Retry a failed first attempt, then perform cleanup
tasks:
  - id: prepare
    type: core.Sleep
    duration: PT0.1S
    timeout: PT5S
  - id: work
    type: core.Log
    message: "{{ taskrun.attemptsCount == 1 ? missing : 'recovered' }}"
    retry:
      type: constant
      maxAttempts: 2
      interval: PT1S
    timeout: PT5S
errors:
  - id: report
    type: core.Log
    message: main failed after retries
finally:
  - id: cleanup
    type: core.Log
    message: cleanup completed
outputs:
  result:
    source: TASK_OUTPUT
    taskId: work
    port: message
