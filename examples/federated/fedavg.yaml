schemaVersion: 1
namespace: lab
id: fedavg
description: Dynamic edge clients, weighted aggregation and global evaluation in every round.
inputs:
  rounds: {type: INTEGER, defaultValue: 2}
  model: {type: STRING, defaultValue: mlp}
  training_dataset: {type: SELECT, values: [mnist-train/v1], defaultValue: mnist-train/v1}
  test_dataset: {type: SELECT, values: [mnist-test/v1], defaultValue: mnist-test/v1}
  local_epochs: {type: INTEGER, defaultValue: 1}
  batch_size: {type: INTEGER, defaultValue: 32}
  learning_rate: {type: NUMBER, defaultValue: 0.01}
tasks:
  - id: init
    type: platform.Application
    timeout: PT5M
    container:
      applicationId: fl-init
      version: v1
      candidateClusters: [cloud]
      command: [python, /app/app.py, init]
      parameters:
        ALGORITHM: {source: LITERAL, value: fedavg}
        MODEL: {source: INPUT, name: model}
      outputFiles: [model.pt]
  - id: rounds
    type: core.Repeat
    repeat:
      iterations: {source: INPUT, name: rounds}
      initial:
        global_model: {source: TASK_OUTPUT, taskId: init, port: model.pt}
      feedback:
        global_model: {source: TASK_OUTPUT, taskId: aggregate, port: model.pt}
    tasks:
      - id: clients
        type: core.Loop
        loop:
          values:
            source: LITERAL
            value:
              - {id: edge-a, clusters: [edge-a]}
              - {id: edge-b, clusters: [edge-b]}
              - {id: edge-c, clusters: [edge-c]}
          concurrency: 6
          outputs:
            models: {source: TASK_OUTPUT, taskId: train, port: model.pt}
        tasks:
          - id: train
            type: platform.Application
            timeout: PT5M
            container:
              applicationId: fedavg-train
              version: v1
              candidateClusters: {source: ITEM, path: [value, clusters]}
              command: [python, /app/app.py, train]
              parameters:
                CLIENT_ID: {source: ITEM, path: [value, id]}
                DATASET: {source: INPUT, name: training_dataset}
                LOCAL_EPOCHS: {source: INPUT, name: local_epochs}
                BATCH_SIZE: {source: INPUT, name: batch_size}
                LEARNING_RATE: {source: INPUT, name: learning_rate}
              inputFiles:
                global_model: {source: TASK_OUTPUT, taskId: rounds, port: global_model}
              outputFiles: [model.pt]
      - id: aggregate
        type: platform.Application
        timeout: PT5M
        container:
          applicationId: fl-aggregate
          version: v1
          candidateClusters: [cloud]
          command: [python, /app/app.py, aggregate, --clients-manifest, /cea-work/in/client_models.json]
          inputFiles:
            client_models: {source: TASK_OUTPUT, taskId: clients, port: models}
          outputFiles: [model.pt]
      - id: evaluate
        type: platform.Application
        timeout: PT5M
        container:
          applicationId: fl-evaluate
          version: v1
          candidateClusters: [cloud]
          command: [python, /app/app.py, evaluate, --output, /cea-work/out/metrics.json]
          parameters:
            TEST_DATASET: {source: INPUT, name: test_dataset}
            BATCH_SIZE: {source: INPUT, name: batch_size}
          inputFiles:
            global_model: {source: TASK_OUTPUT, taskId: aggregate, port: model.pt}
          outputFiles: [metrics.json]
outputs:
  global_model: {source: TASK_OUTPUT, taskId: rounds, port: global_model}
  completed_rounds: {source: TASK_OUTPUT, taskId: rounds, port: iterationCount}
