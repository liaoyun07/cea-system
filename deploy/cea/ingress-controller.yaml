# ING-01: independent controller; K3s packaged Traefik remains disabled.
apiVersion: v1
kind: Namespace
metadata: {name: cea-ingress}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cea-traefik, namespace: cea-ingress}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cea-traefik}
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cea-traefik}
subjects: [{kind: ServiceAccount, name: cea-traefik, namespace: cea-ingress}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cea-traefik}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: cea-traefik}
spec: {controller: traefik.io/ingress-controller}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cea-traefik, namespace: cea-ingress}
spec:
  replicas: 1
  selector: {matchLabels: {app: cea-traefik}}
  template:
    metadata: {labels: {app: cea-traefik}}
    spec:
      serviceAccountName: cea-traefik
      containers:
        - name: traefik
          image: traefik:v3.7.13
          imagePullPolicy: IfNotPresent
          args:
            - --entrypoints.web.address=:8000
            - --entrypoints.health.address=:8082
            - --ping=true
            - --ping.entrypoint=health
            - --api.dashboard=false
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.strictprefixmatching=true
            - --providers.kubernetesingress.ingressclass=cea-traefik
            - --providers.kubernetesingress.labelselector=cea-system/owner=cea-system
          ports: [{name: web, containerPort: 8000}, {name: health, containerPort: 8082}]
          readinessProbe: {httpGet: {path: /ping, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /ping, port: health}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 65532, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: cea-traefik, namespace: cea-ingress}
spec:
  type: NodePort
  selector: {app: cea-traefik}
  ports: [{name: web, port: 80, targetPort: web, nodePort: 30080}]
