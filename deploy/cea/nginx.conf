server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 4m;
    location ~ ^/api/namespaces/[^/]+/applications/[^/]+/versions/[^/]+/(upload|build)$ {
        client_max_body_size 2050m;
        proxy_request_buffering off;
        proxy_pass http://backend:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1200s;
        client_body_timeout 120s;
        error_page 413 = @upload_too_large;
    }
    location @upload_too_large {
        default_type application/json;
        return 413 '{"code":"UPLOAD_TOO_LARGE","message":"Image archive exceeds upload limit"}';
    }
    location /api/ {
        proxy_pass http://backend:18085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
