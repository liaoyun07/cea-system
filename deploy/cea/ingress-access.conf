# Only bridges Windows loopback to the four Docker-internal K3s NodePorts.
# Host/path routing belongs to Traefik/Ingress, not this bridge or the CEA UI.
map $server_port $ingress_backend {
    8080 cloud:30080;
    8081 edge-a:30080;
    8082 edge-b:30080;
    8083 edge-c:30080;
}
server {
    listen 8080;
    listen 8081;
    listen 8082;
    listen 8083;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 0;
    location / {
        proxy_pass http://$ingress_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
